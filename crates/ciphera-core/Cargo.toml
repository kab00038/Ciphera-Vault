[package]
name = "ciphera-core"
version = "0.1.0"
description = "Encrypted local vault core for Ciphera"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
atomic-write-file = "0.3.0"
chrono = "0.4"
csv = "1.3"
keepass = { version = "=0.13.20", features = ["save_kdbx4", "totp"] }
argon2 = { package = "rust-argon2", version = "3.0" }
serde.workspace = true
sha2 = "0.11"
thiserror.workspace = true
url = "2.5"
uuid.workspace = true

[dev-dependencies]
tempfile = "3.23"
