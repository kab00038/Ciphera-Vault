[package]
name = "ciphera"
version = "0.1.3"
description = "Offline-first password manager with optional browser integration"
authors = ["Ciphera contributors"]
license.workspace = true
repository = "https://github.com/kab00038/Ciphera-Vault"
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
ciphera-core = { path = "../crates/ciphera-core" }
ciphera-platform = { path = "../crates/ciphera-platform" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "=2.4.3"
dirs = "6"
rand = "0.9"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
reqwest.workspace = true
sha1.workspace = true
sha2 = "0.11"
zeroize.workspace = true

[dev-dependencies]
tempfile = "3.23"
tauri = { version = "2.11.3", features = ["test"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
