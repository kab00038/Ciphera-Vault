name: Package desktop application

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Test Rust workspace
        run: cargo test --workspace --locked

  package:
    name: Package ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            platform: ubuntu-22.04
            args: --no-sign --bundles appimage,deb,rpm
            artifact: linux-x86_64
          - name: Windows x86_64
            platform: windows-latest
            args: --no-sign --bundles nsis,msi
            artifact: windows-x86_64
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --no-sign --target aarch64-apple-darwin --bundles dmg
            artifact: macos-aarch64
          - name: macOS Intel
            platform: macos-latest
            args: --no-sign --target x86_64-apple-darwin --bundles dmg
            artifact: macos-x86_64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: ${{ startsWith(matrix.name, 'macOS') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build native packages
        uses: tauri-apps/tauri-action@v1
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: ciphera-${{ matrix.artifact }}-[bundle]

  package-arch:
    name: Package Arch Linux x86_64
    needs: verify
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7

      - name: Install Arch build dependencies
        run: pacman -Syu --noconfirm git gtk3 nodejs npm rust webkit2gtk-4.1

      - name: Build pacman package
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser --user builder -- env HOME=/home/builder ./packaging/arch/build-package.sh

      - name: Upload Arch package
        uses: actions/upload-artifact@v6
        with:
          name: ciphera-arch-x86_64-pacman
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error
