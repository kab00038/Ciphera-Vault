name: Publish desktop release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - run: npm ci
      - name: Resolve and verify release version
        id: release-version
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ -n "$REQUESTED_TAG" ]]; then
            test "$REQUESTED_TAG" = "$tag"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$tag"
          fi
      - run: npm run lint
      - run: npm run build
      - run: cargo test --workspace --locked

  publish:
    name: Publish ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cache_key: linux-x86_64
            args: --bundles appimage,deb,rpm
          - name: Windows x86_64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            cache_key: windows-x86_64
            args: --bundles nsis
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            cache_key: macos-aarch64
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            cache_key: macos-x86_64
            args: --target x86_64-apple-darwin --bundles dmg

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          shared-key: desktop-${{ matrix.cache_key }}

      - run: npm ci

      - name: Build and upload signed update
        uses: tauri-apps/tauri-action@v1
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: Ciphera v__VERSION__
          releaseBody: Download the installer for your platform. Existing installations can update from inside Ciphera.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  build-arch:
    name: Build Arch Linux x86_64
    needs: verify
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install Arch build dependencies
        run: pacman -Syu --noconfirm git gtk3 nodejs npm rust webkit2gtk-4.1

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          shared-key: desktop-arch-x86_64

      - name: Build pacman package
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser --user builder -- env HOME=/home/builder ./packaging/arch/build-package.sh

      - name: Stage Arch package
        uses: actions/upload-artifact@v6
        with:
          name: ciphera-arch-x86_64-pacman
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  publish-arch:
    name: Publish Arch Linux x86_64
    needs:
      - verify
      - publish
      - build-arch
    runs-on: ubuntu-22.04
    steps:
      - name: Download Arch package
        uses: actions/download-artifact@v7
        with:
          name: ciphera-arch-x86_64-pacman
          path: packaging/arch

      - name: Upload package to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" packaging/arch/*.pkg.tar.zst --clobber --repo "$GITHUB_REPOSITORY"

  finalize:
    name: Publish completed release
    needs:
      - verify
      - publish-arch
    runs-on: ubuntu-22.04
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
