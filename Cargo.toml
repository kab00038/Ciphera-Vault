[workspace]
members = ["crates/ciphera-core", "crates/ciphera-platform", "src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["serde", "v4"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha1 = "0.10"

# Strip release-only overhead without slowing builds with LTO or reducing crypto throughput.
[profile.release]
panic = "abort"
strip = "symbols"
